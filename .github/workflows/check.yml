name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: OpenCL link stub
        run: python3 scripts/make-opencl-stub.py "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Core tests, APK, and lint
        env:
          PYTHONUTF8: '1'
        run: bash gradlew :core:test :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-results
          path: |
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
